<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podpořit tvorbu — SHOTBYLARO</title>
    <style>
        :root {
            --bg-color: #070707;
            --card-bg: rgba(14, 14, 14, 0.88);
            --accent-color: #ffffff;
            --text-color: #eef0ef;
            --text-dim: #a0a0a0;
            --border-color: rgba(255, 255, 255, 0.08);
            --revolut-blue: #3b55c2; /* Přesná barva z tvého vzorku */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Ostrá fotka donate.jpg s gradientními stínidly nahoře a dole a jemným ztmavením středu */
            background-image: 
                linear-gradient(to bottom, rgba(7, 7, 7, 0.85) 0%, rgba(7, 7, 7, 0.2) 30%, rgba(7, 7, 7, 0.2) 70%, rgba(7, 7, 7, 0.9) 100%), 
                url('donate.jpg');
            background-color: var(--bg-color);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        /* Wrapper pro PC: Karta vlevo, text vpravo */
        .wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1100px;
            gap: 5rem;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 24px 48px rgba(0,0,0,0.7);
            flex-shrink: 0;
        }

        /* Decentní text vpravo (na mobilech skrytý) */
        .side-text {
            display: none;
            max-width: 380px;
        }

        .side-text h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 1rem;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .side-text p {
            font-size: 1.05rem;
            color: var(--text-dim);
            line-height: 1.6;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        /* Na počítačích rozestavíme kartu vlevo a text vpravo */
        @media (min-width: 900px) {
            body {
                justify-content: flex-start;
                padding-left: 6vw;
            }
            .wrapper {
                justify-content: flex-start;
                flex-direction: row-reverse; /* Prohodí pořadí: karta vlevo, text vpravo */
                gap: 6rem;
            }
            .side-text {
                display: block;
            }
        }

        .logo-title {
            font-size: 1.4rem;
            letter-spacing: 4px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
            color: var(--accent-color);
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-dim);
            margin-bottom: 1.8rem;
            line-height: 1.5;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            padding: 1rem 1.5rem;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            transition: transform 0.2s ease, opacity 0.2s ease;
            cursor: pointer;
            border: none;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-revolut {
            background: var(--revolut-blue);
            color: #ffffff;
        }

        .qr-box {
            background: rgba(26, 26, 26, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 1.5rem;
            margin-top: 0.2rem;
        }

        .currency-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 1.2rem;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-dim);
            padding: 0.5rem;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: var(--bg-color);
        }

        .currency-content {
            display: none;
        }

        .currency-content.active {
            display: block;
        }

        .qr-code {
            width: 170px;
            height: 170px;
            background: #ffffff;
            padding: 8px;
            border-radius: 12px;
            margin: 0 auto 0.8rem auto;
            display: block;
        }

        .account-details {
            font-size: 0.82rem;
            color: var(--text-dim);
            font-family: monospace;
            line-height: 1.4;
            word-break: break-all;
        }

        .account-details span {
            color: var(--text-color);
            font-weight: 600;
        }
